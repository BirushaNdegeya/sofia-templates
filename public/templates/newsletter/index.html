<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter | Sofia Templates</title>
    <meta name="description" content="A ready-to-use newsletter signup template.">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Weekly notes</p>
      <h1>Get design snippets in your inbox</h1>
      <p class="lead">One short email every Monday with templates, layout ideas, and copy you can reuse.</p>
      <form action="#" method="post">
        <label for="email">Email address</label>
        <div class="row">
          <input id="email" type="email" name="email" placeholder="you@studio.com" required>
          <button type="submit">Subscribe</button>
        </div>
      </form>
      <p class="fine">No spam. Unsubscribe anytime.</p>
    </main>
  </body>
</html>
