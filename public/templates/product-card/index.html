<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card | Sofia Templates</title>
    <meta name="description" content="A ready-to-use ecommerce product card template.">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <article class="card">
      <div class="media" aria-hidden="true">
        <div class="shoe"></div>
      </div>
      <p class="tag">Limited drop</p>
      <h1>Aero Runner X</h1>
      <p class="copy">Lightweight daily trainers with a breathable knit upper and responsive foam sole.</p>
      <div class="meta">
        <strong>$129</strong>
        <span>4.8 ★ · 214 reviews</span>
      </div>
      <button type="button">Add to cart</button>
    </article>
  </body>
</html>
