<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sofia Templates</title>
    <meta name="description" content="A ready-to-use contact form template.">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Get in touch</p>
      <h1>Tell us about your project</h1>
      <p class="lead">We usually reply within one business day.</p>
      <form action="#" method="post">
        <div class="grid">
          <label>
            Name
            <input type="text" name="name" placeholder="Alex Rivera" required>
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="alex@studio.com" required>
          </label>
        </div>
        <label>
          Message
          <textarea name="message" rows="4" placeholder="I would like a landing page for..." required></textarea>
        </label>
        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
